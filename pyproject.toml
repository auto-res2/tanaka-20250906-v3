[project]
name = "pax_experiment"
version = "0.1.0"
description = "PAX experiment suite – refactored into a structured package"
requires-python = ">=3.9"

# ------------------------------------------------------------------ runtimes
# Torch & Deepspeed are heavy but explicitly required by the original script.
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "requests>=2.31.0",
    "torch>=2.1.0",
    "deepspeed>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
